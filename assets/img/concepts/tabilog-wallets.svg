<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="TabiLog budgets screen showing per-person wallet cards with currency themes, balances and monthly limit progress">
  <defs>
    <clipPath id="scr"><rect width="320" height="660" rx="20"/></clipPath>
    <clipPath id="c1"><rect x="16" y="140" width="288" height="132" rx="16"/></clipPath>
    <clipPath id="c2"><rect x="16" y="286" width="288" height="132" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="16" y="432" width="288" height="132" rx="16"/></clipPath>
    <linearGradient id="jp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde8ee"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeeda"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f3ef"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .h1 { font-size: 17px; font-weight: 700; fill: #1f2430; }
      .nm { font-size: 13px; font-weight: 700; fill: #1f2430; }
      .wl { font-size: 10px; font-weight: 500; fill: #6b7280; }
      .bal { font-size: 20px; font-weight: 800; fill: #1f2430; }
      .mu { font-size: 9px; font-weight: 500; fill: #6b7280; }
      .chip { font-size: 8.5px; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#scr)">
    <rect width="320" height="660" fill="#f4f5f7"/>

    <!-- status bar -->
    <text class="t" x="18" y="20" font-size="10" font-weight="700" fill="#1f2430">9:41</text>
    <g fill="#1f2430">
      <rect x="262" y="12" width="3" height="7" rx="1"/><rect x="267" y="10" width="3" height="9" rx="1"/><rect x="272" y="8" width="3" height="11" rx="1"/>
      <rect x="284" y="9" width="17" height="9" rx="2.5" fill="none" stroke="#1f2430" stroke-width="1.2"/><rect x="286" y="11" width="11" height="5" rx="1"/>
    </g>

    <!-- header -->
    <rect x="0" y="30" width="320" height="52" fill="#ffffff"/>
    <rect x="0" y="81.5" width="320" height="1" fill="#e2e4e9"/>
    <text class="t h1" x="18" y="61">Budgets</text>
    <rect x="226" y="44" width="52" height="24" rx="12" fill="#2f6fed"/>
    <text class="t" x="252" y="59.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add</text>
    <circle cx="295" cy="56" r="11" fill="#f0f1f4"/>
    <circle cx="295" cy="53" r="3.4" fill="#6b7280"/><path d="M289.5 62.5a5.8 5.8 0 0 1 11 0z" fill="#6b7280"/>

    <!-- tabs -->
    <g class="t">
      <rect x="16" y="94" width="288" height="34" rx="10" fill="#e9ebef"/>
      <rect x="160" y="97" width="141" height="28" rx="8" fill="#ffffff"/>
      <text x="89" y="115.5" font-size="11" font-weight="500" fill="#6b7280" text-anchor="middle">Dashboard</text>
      <text x="230" y="115.5" font-size="11" font-weight="600" fill="#1f2430" text-anchor="middle">Budgets</text>
    </g>

    <!-- ============ card 1: JPY (Mt Fuji + sakura) ============ -->
    <g clip-path="url(#c1)">
      <rect x="16" y="140" width="288" height="132" fill="url(#jp)"/>
      <!-- fuji -->
      <path d="M196 236 l40-52 40 52z" fill="#e9a8bb" opacity="0.5"/>
      <path d="M225 197 l11-13 11 13 -7-3 -5 4 -5-3z" fill="#ffffff" opacity="0.9"/>
      <circle cx="272" cy="166" r="12" fill="#f4b8c8" opacity="0.6"/>
      <g fill="#e78ba6" opacity="0.45">
        <circle cx="204" cy="163" r="3.4"/><circle cx="212" cy="156" r="2.6"/><circle cx="219" cy="168" r="2.2"/>
      </g>
    </g>
    <rect x="16" y="140" width="288" height="132" rx="16" fill="none" stroke="#e2e4e9"/>
    <text class="t nm" x="32" y="166">Aydin</text>
    <text class="t wl" x="32" y="181">From Kairul</text>
    <rect x="32" y="188" width="34" height="15" rx="7.5" fill="#e9a8bb" opacity="0.35"/>
    <text class="t chip" x="49" y="198.5" fill="#b3576f" text-anchor="middle">JPY</text>
    <text class="t bal" x="32" y="230">¥11,400</text>
    <text class="t mu" x="32" y="244">62% of ¥30,000 monthly limit</text>
    <rect x="32" y="252" width="150" height="7" rx="3.5" fill="#e9ebef"/>
    <rect x="32" y="252" width="93" height="7" rx="3.5" fill="#2fa86a"/>

    <!-- ============ card 2: AUD (outback sunset) ============ -->
    <g clip-path="url(#c2)">
      <rect x="16" y="286" width="288" height="132" fill="url(#au)"/>
      <circle cx="252" cy="330" r="20" fill="#f0a23c" opacity="0.45"/>
      <path d="M196 382 q30-26 52-6 q22-22 56-4 v46 h-108z" fill="#e08a3a" opacity="0.3"/>
      <path d="M222 382 v-22 m0 8 l-7-7 m7 12 l7-9" stroke="#c2703a" stroke-width="2.4" opacity="0.5" fill="none" stroke-linecap="round"/>
    </g>
    <rect x="16" y="286" width="288" height="132" rx="16" fill="none" stroke="#e2e4e9"/>
    <text class="t nm" x="32" y="312">Aydin</text>
    <text class="t wl" x="32" y="327">From Mother</text>
    <rect x="32" y="334" width="34" height="15" rx="7.5" fill="#f0a23c" opacity="0.35"/>
    <text class="t chip" x="49" y="344.5" fill="#a86420" text-anchor="middle">AUD</text>
    <text class="t bal" x="32" y="376">A$44.00</text>
    <text class="t mu" x="32" y="390">103% of A$200 monthly limit</text>
    <rect x="32" y="398" width="150" height="7" rx="3.5" fill="#e9ebef"/>
    <rect x="32" y="398" width="150" height="7" rx="3.5" fill="#d64545"/>

    <!-- ============ card 3: SGD (Merlion) ============ -->
    <g clip-path="url(#c3)">
      <rect x="16" y="432" width="288" height="132" fill="url(#sg)"/>
      <path d="M244 528 q6-30 22-32 q-4-12 6-16 q10 4 6 16 q16 2 22 32z" fill="#5cb0a0" opacity="0.32"/>
      <path d="M232 512 q14 2 22-6" stroke="#4d9c8d" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>
      <circle cx="270" cy="470" r="14" fill="#7cc4b6" opacity="0.3"/>
    </g>
    <rect x="16" y="432" width="288" height="132" rx="16" fill="none" stroke="#e2e4e9"/>
    <text class="t nm" x="32" y="458">Aaron</text>
    <text class="t wl" x="32" y="473">Layover money</text>
    <rect x="32" y="480" width="34" height="15" rx="7.5" fill="#5cb0a0" opacity="0.35"/>
    <text class="t chip" x="49" y="490.5" fill="#2f7a6c" text-anchor="middle">SGD</text>
    <text class="t bal" x="32" y="522">S$86.50</text>
    <text class="t mu" x="32" y="536">No monthly limit set</text>
    <rect x="32" y="544" width="150" height="7" rx="3.5" fill="#e9ebef" opacity="0.6"/>

    <!-- bottom bar -->
    <rect x="0" y="596" width="320" height="64" fill="#ffffff"/>
    <rect x="0" y="596" width="320" height="1" fill="#e2e4e9"/>
    <g class="t" text-anchor="middle">
      <rect x="46" y="610" width="28" height="20" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <rect x="52" y="620" width="4" height="7" fill="#6b7280"/><rect x="58" y="615" width="4" height="12" fill="#6b7280"/><rect x="64" y="618" width="4" height="9" fill="#6b7280"/>
      <text x="60" y="644" font-size="8.5" font-weight="500" fill="#6b7280">Dashboard</text>
      <rect x="146" y="610" width="28" height="20" rx="4" fill="none" stroke="#2f6fed" stroke-width="1.8"/>
      <circle cx="167" cy="620" r="2.2" fill="#2f6fed"/>
      <text x="160" y="644" font-size="8.5" font-weight="600" fill="#2f6fed">Budgets</text>
      <circle cx="260" cy="620" r="10" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <path d="M260 614v7l4 3" stroke="#6b7280" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="260" y="644" font-size="8.5" font-weight="500" fill="#6b7280">History</text>
    </g>
    <rect x="118" y="652" width="84" height="4" rx="2" fill="#1f2430" opacity="0.28"/>
  </g>
</svg>
