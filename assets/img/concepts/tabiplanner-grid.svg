      <text class="t dl" x="68" y="270">Fushimi</text>
      <text class="t dl" x="68" y="280">Inari</text>
      <text class="t dl" x="68" y="290">Gion</text>
      <text class="t" x="68" y="308" font-size="6.5" font-weight="700" fill="#5c6b62">A$85</text>

      <rect x="100" y="240" width="42" height="78" fill="#ffffff"/>
