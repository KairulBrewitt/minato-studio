      <text class="t dl" x="236" y="200">Skytree</text>
      <text class="t dl" x="236" y="210">Ramen</text>
      <text class="t" x="236" y="228" font-size="6.5" font-weight="700" fill="#5c6b62">A$140</text>

      <rect x="268" y="160" width="36" height="78" fill="#ffffff"/>
      <text class="t dn" x="278" y="176">24</text>
      <text class="t dl" x="278" y="190">Nara</text>
      <text class="t dl" x="278" y="200">day trip</text>
      <text class="t" x="278" y="228" font-size="6.5" font-weight="700" fill="#5c6b62">A$96</text>
    </g>

    <!-- row 2 -->
    <g>
      <rect x="16" y="240" width="42" height="78" fill="#ffffff"/>
