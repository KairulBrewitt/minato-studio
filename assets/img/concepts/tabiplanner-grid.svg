      <text class="t dl" x="236" y="270">Himeji</text>
      <text class="t dl" x="236" y="280">castle</text>
      <text class="t" x="236" y="308" font-size="6.5" font-weight="700" fill="#5c6b62">A$74</text>

      <rect x="268" y="240" width="36" height="78" fill="#ffffff"/>
