      <rect x="300" y="320" width="4" height="78" fill="#d1553a"/>
      <text class="t dn" x="278" y="336">8</text>
      <text class="t dl" x="278" y="350">Fly home</text>
      <text class="t dl" x="278" y="360">HND</text>
    </g>

    <!-- grid lines -->
    <g stroke="#e6ece8" stroke-width="1">
      <path d="M16 160h288M16 240h288M16 320h288M16 398h288"/>
      <path d="M58 160v238M100 160v238M142 160v238M184 160v238M226 160v238M268 160v238"/>
    </g>
    <rect x="16" y="160" width="288" height="238" rx="10" fill="none" stroke="#dde5e0" stroke-width="1.4"/>

    <!-- selected day detail -->
    <text class="t" x="18" y="428" font-size="9.5" font-weight="700" fill="#7d8b83" letter-spacing="0.06em">SAT 26 SEP · KYOTO</text>

    <g>
      <rect x="16" y="440" width="288" height="46" rx="12" fill="#ffffff"/>
      <rect x="16" y="440" width="3" height="46" rx="1.5" fill="#1f8a5b"/>
      <text class="t" x="32" y="459" font-size="9" font-weight="700" fill="#5c6b62">07:40</text>
      <text class="t" x="76" y="459" font-size="11" font-weight="600" fill="#17211c">Fushimi Inari</text>
      <text class="t" x="76" y="473" font-size="8.5" font-weight="500" fill="#5c6b62">Before the crowds · 2 hrs</text>
      <text class="t" x="290" y="466" font-size="9.5" font-weight="700" fill="#5c6b62" text-anchor="end">free</text>
    </g>

    <g>
      <rect x="16" y="492" width="288" height="46" rx="12" fill="#ffffff"/>
      <rect x="16" y="492" width="3" height="46" rx="1.5" fill="#d99b1a"/>
      <text class="t" x="32" y="511" font-size="9" font-weight="700" fill="#5c6b62">12:15</text>
      <text class="t" x="76" y="511" font-size="11" font-weight="600" fill="#17211c">Nishiki Market</text>
      <text class="t" x="76" y="525" font-size="8.5" font-weight="500" fill="#5c6b62">Lunch · cash only</text>
      <text class="t" x="290" y="518" font-size="9.5" font-weight="700" fill="#5c6b62" text-anchor="end">A$40</text>
    </g>

    <g>
      <rect x="16" y="544" width="288" height="46" rx="12" fill="#ffffff"/>
      <rect x="16" y="544" width="3" height="46" rx="1.5" fill="#8b5cf6"/>
      <text class="t" x="32" y="563" font-size="9" font-weight="700" fill="#5c6b62">18:00</text>
      <text class="t" x="76" y="563" font-size="11" font-weight="600" fill="#17211c">Gion walk</text>
      <text class="t" x="76" y="577" font-size="8.5" font-weight="500" fill="#5c6b62">Booked · ref GK-8841</text>
      <text class="t" x="290" y="570" font-size="9.5" font-weight="700" fill="#5c6b62" text-anchor="end">A$45</text>
    </g>

    <rect x="16" y="600" width="288" height="40" rx="20" fill="#17211c"/>
    <text class="t" x="160" y="625" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add to this day</text>

    <rect x="118" y="650" width="84" height="4" rx="2" fill="#17211c" opacity="0.25"/>
  </g>
</svg>
