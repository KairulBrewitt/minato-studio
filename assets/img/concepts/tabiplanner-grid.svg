      <text class="t dl" x="68" y="360">en</text>
      <text class="t" x="68" y="388" font-size="6.5" font-weight="700" fill="#5c6b62">A$48</text>

      <rect x="100" y="320" width="42" height="78" fill="#ffffff"/>
