      <text x="37" y="150">M</text><text x="79" y="150">T</text><text x="121" y="150">W</text>
      <text x="163" y="150">T</text><text x="205" y="150">F</text><text x="247" y="150">S</text><text x="289" y="150">S</text>
    </g>

    <!-- week 1: trip starts on 22nd (Mon) -->
    <g>
      <!-- row 1 -->
      <rect x="16" y="160" width="42" height="78" fill="#eef2ef" opacity="0.5"/>
      <rect x="58" y="160" width="42" height="78" fill="#eef2ef" opacity="0.5"/>
      <rect x="100" y="160" width="42" height="78" fill="#eef2ef" opacity="0.5"/>
      <rect x="142" y="160" width="42" height="78" fill="#eef2ef" opacity="0.5"/>
      <text class="t" x="26" y="176" font-size="10" font-weight="600" fill="#b8c4bd">18</text>
      <text class="t" x="68" y="176" font-size="10" font-weight="600" fill="#b8c4bd">19</text>
      <text class="t" x="110" y="176" font-size="10" font-weight="600" fill="#b8c4bd">20</text>
      <text class="t" x="152" y="176" font-size="10" font-weight="600" fill="#b8c4bd">21</text>

      <rect x="184" y="160" width="42" height="78" fill="#ffffff"/>
      <rect x="184" y="160" width="3" height="78" fill="#1f8a5b"/>
