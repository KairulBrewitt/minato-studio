<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="TabiPlanner month grid on a phone, showing a whole trip at a glance with a two-line summary per day">
  <defs>
    <clipPath id="scr"><rect width="320" height="660" rx="20"/></clipPath>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .h1 { font-size: 17px; font-weight: 700; fill: #17211c; }
      .dn { font-size: 10px; font-weight: 700; fill: #17211c; }
      .dl { font-size: 6.8px; font-weight: 500; fill: #5c6b62; }
      .dow { font-size: 8px; font-weight: 700; fill: #7d8b83; letter-spacing: 0.08em; }
      .mu { font-size: 9.5px; font-weight: 500; fill: #5c6b62; }
    </style>
  </defs>

  <g clip-path="url(#scr)">
    <rect width="320" height="660" fill="#f6f8f6"/>

    <text class="t" x="18" y="20" font-size="10" font-weight="700" fill="#17211c">9:41</text>
    <g fill="#17211c">
      <rect x="262" y="12" width="3" height="7" rx="1"/><rect x="267" y="10" width="3" height="9" rx="1"/><rect x="272" y="8" width="3" height="11" rx="1"/>
      <rect x="284" y="9" width="17" height="9" rx="2.5" fill="none" stroke="#17211c" stroke-width="1.2"/><rect x="286" y="11" width="11" height="5" rx="1"/>
    </g>

    <!-- header -->
    <rect x="0" y="30" width="320" height="56" fill="#ffffff"/>
    <rect x="0" y="85.5" width="320" height="1" fill="#dde5e0"/>
    <text class="t h1" x="18" y="58">Japan · September</text>
    <text class="t mu" x="18" y="74">21 days · 84 items · A$6,410 planned</text>
    <circle cx="292" cy="58" r="13" fill="#e4f4ec"/>
    <path d="M287 58h10M292 53v10" stroke="#1f8a5b" stroke-width="2" stroke-linecap="round"/>

    <!-- offline chip -->
    <rect x="16" y="100" width="118" height="24" rx="12" fill="#e4f4ec"/>
    <circle cx="31" cy="112" r="3.6" fill="#1f8a5b"/>
    <text class="t" x="42" y="116" font-size="9" font-weight="600" fill="#1a6b48">Offline · saved</text>
    <rect x="142" y="100" width="80" height="24" rx="12" fill="#ffffff" stroke="#dde5e0"/>
    <text class="t" x="182" y="116" font-size="9" font-weight="600" fill="#5c6b62" text-anchor="middle">Export</text>

    <!-- day-of-week header -->
