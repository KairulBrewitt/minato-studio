<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-label="TabiLog pending receipts inbox, showing captured receipt photos waiting to be filed with an amount and budget">
  <defs>
    <clipPath id="scr"><rect width="320" height="660" rx="20"/></clipPath>
    <clipPath id="p1"><rect x="30" y="184" width="64" height="80" rx="8"/></clipPath>
    <clipPath id="p2"><rect x="30" y="292" width="64" height="80" rx="8"/></clipPath>
    <clipPath id="p3"><rect x="30" y="400" width="64" height="80" rx="8"/></clipPath>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .h1 { font-size: 17px; font-weight: 700; fill: #1f2430; }
      .ti { font-size: 12px; font-weight: 600; fill: #1f2430; }
      .mu { font-size: 9.5px; font-weight: 500; fill: #6b7280; }
    </style>
  </defs>

  <g clip-path="url(#scr)">
    <rect width="320" height="660" fill="#f4f5f7"/>

    <text class="t" x="18" y="20" font-size="10" font-weight="700" fill="#1f2430">9:41</text>
    <g fill="#1f2430">
      <rect x="262" y="12" width="3" height="7" rx="1"/><rect x="267" y="10" width="3" height="9" rx="1"/><rect x="272" y="8" width="3" height="11" rx="1"/>
      <rect x="284" y="9" width="17" height="9" rx="2.5" fill="none" stroke="#1f2430" stroke-width="1.2"/><rect x="286" y="11" width="11" height="5" rx="1"/>
    </g>

    <!-- header -->
    <rect x="0" y="30" width="320" height="52" fill="#ffffff"/>
    <rect x="0" y="81.5" width="320" height="1" fill="#e2e4e9"/>
    <path d="M28 56 l8-8 m-8 8 l8 8 m-8-8 h18" stroke="#1f2430" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t h1" x="60" y="61">Pending receipts</text>

    <!-- intro strip -->
    <rect x="16" y="98" width="288" height="60" rx="14" fill="#e8effd"/>
    <circle cx="44" cy="128" r="14" fill="#2f6fed" opacity="0.16"/>
    <g stroke="#2f6fed" stroke-width="1.7" fill="none" stroke-linecap="round">
      <rect x="36" y="122" width="16" height="12" rx="2.5"/>
      <path d="M40 122l1.6-2.6h4.8L48 122"/>
      <circle cx="44" cy="128" r="3.2"/>
    </g>
    <text class="t" x="68" y="122" font-size="11" font-weight="600" fill="#1b4bb0">Snap now, sort later</text>
    <text class="t" x="68" y="137" font-size="9.5" font-weight="500" fill="#3f6bc4">3 photos waiting · no rush</text>

    <!-- ============= receipt 1 ============= -->
    <rect x="16" y="172" width="288" height="104" rx="16" fill="#ffffff"/>
    <g clip-path="url(#p1)">
      <rect x="30" y="184" width="64" height="80" fill="#f1ede4"/>
      <rect x="36" y="192" width="52" height="64" fill="#ffffff"/>
      <g fill="#c9c3b6">
        <rect x="42" y="199" width="28" height="4" rx="2"/>
        <rect x="42" y="209" width="40" height="3" rx="1.5"/>
        <rect x="42" y="216" width="34" height="3" rx="1.5"/>
        <rect x="42" y="223" width="38" height="3" rx="1.5"/>
        <rect x="42" y="230" width="30" height="3" rx="1.5"/>
      </g>
      <rect x="42" y="241" width="40" height="1.5" fill="#ded7c8"/>
      <rect x="42" y="246" width="24" height="5" rx="2" fill="#a9a294"/>
    </g>
    <rect x="30" y="184" width="64" height="80" rx="8" fill="none" stroke="#e2e4e9"/>
    <text class="t ti" x="108" y="200">Lawson, Shinjuku</text>
    <text class="t mu" x="108" y="217">Captured 14 Sep · 7:42 pm</text>
    <text class="t mu" x="108" y="232" fill="#d99b1a">Needs amount &amp; budget</text>
    <rect x="108" y="240" width="72" height="24" rx="12" fill="#2f6fed"/>
    <text class="t" x="144" y="255.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Finish</text>
    <rect x="188" y="240" width="66" height="24" rx="12" fill="none" stroke="#e2e4e9"/>
    <text class="t" x="221" y="255.5" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Discard</text>

    <!-- ============= receipt 2 ============= -->
    <rect x="16" y="280" width="288" height="104" rx="16" fill="#ffffff"/>
    <g clip-path="url(#p2)">
      <rect x="30" y="292" width="64" height="80" fill="#e8eef1"/>
      <rect x="34" y="300" width="56" height="64" rx="2" fill="#ffffff" transform="rotate(-3 62 332)"/>
      <g fill="#c6cfd4" transform="rotate(-3 62 332)">
        <rect x="42" y="308" width="32" height="4" rx="2"/>
        <rect x="42" y="318" width="42" height="3" rx="1.5"/>
        <rect x="42" y="325" width="30" height="3" rx="1.5"/>
        <rect x="42" y="332" width="38" height="3" rx="1.5"/>
      </g>
    </g>
    <rect x="30" y="292" width="64" height="80" rx="8" fill="none" stroke="#e2e4e9"/>
    <text class="t ti" x="108" y="308">Souvenir shop</text>
    <text class="t mu" x="108" y="325">Captured 14 Sep · 3:10 pm</text>
    <text class="t mu" x="108" y="340" fill="#d99b1a">Needs amount &amp; budget</text>
    <rect x="108" y="348" width="72" height="24" rx="12" fill="#2f6fed"/>
    <text class="t" x="144" y="363.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Finish</text>
    <rect x="188" y="348" width="66" height="24" rx="12" fill="none" stroke="#e2e4e9"/>
    <text class="t" x="221" y="363.5" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Discard</text>

    <!-- ============= receipt 3 ============= -->
    <rect x="16" y="388" width="288" height="104" rx="16" fill="#ffffff"/>
    <g clip-path="url(#p3)">
      <rect x="30" y="400" width="64" height="80" fill="#efe9ee"/>
      <rect x="38" y="408" width="48" height="64" fill="#ffffff"/>
      <g fill="#cdc3ca">
        <rect x="44" y="416" width="26" height="4" rx="2"/>
        <rect x="44" y="426" width="36" height="3" rx="1.5"/>
        <rect x="44" y="433" width="28" height="3" rx="1.5"/>
        <rect x="44" y="440" width="34" height="3" rx="1.5"/>
      </g>
      <rect x="44" y="452" width="22" height="5" rx="2" fill="#a99ea6"/>
    </g>
    <rect x="30" y="400" width="64" height="80" rx="8" fill="none" stroke="#e2e4e9"/>
    <text class="t ti" x="108" y="416">Train station kiosk</text>
    <text class="t mu" x="108" y="433">Captured 13 Sep · 8:55 am</text>
    <text class="t mu" x="108" y="448" fill="#d99b1a">Needs amount &amp; budget</text>
    <rect x="108" y="456" width="72" height="24" rx="12" fill="#2f6fed"/>
    <text class="t" x="144" y="471.5" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Finish</text>
    <rect x="188" y="456" width="66" height="24" rx="12" fill="none" stroke="#e2e4e9"/>
    <text class="t" x="221" y="471.5" font-size="10" font-weight="500" fill="#6b7280" text-anchor="middle">Discard</text>

    <!-- capture button -->
    <rect x="16" y="510" width="288" height="46" rx="23" fill="#1f2430"/>
    <g stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round">
      <rect x="112" y="525" width="18" height="14" rx="3"/>
      <path d="M116.5 525l1.8-3h3.4l1.8 3"/>
      <circle cx="121" cy="532" r="3.6"/>
    </g>
    <text class="t" x="176" y="538" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Capture a receipt</text>

    <!-- bottom bar -->
    <rect x="0" y="596" width="320" height="64" fill="#ffffff"/>
    <rect x="0" y="596" width="320" height="1" fill="#e2e4e9"/>
    <g class="t" text-anchor="middle">
      <rect x="46" y="610" width="28" height="20" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <rect x="52" y="620" width="4" height="7" fill="#6b7280"/><rect x="58" y="615" width="4" height="12" fill="#6b7280"/><rect x="64" y="618" width="4" height="9" fill="#6b7280"/>
      <text x="60" y="644" font-size="8.5" font-weight="500" fill="#6b7280">Dashboard</text>
      <rect x="146" y="610" width="28" height="20" rx="4" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <circle cx="167" cy="620" r="2.2" fill="#6b7280"/>
      <text x="160" y="644" font-size="8.5" font-weight="500" fill="#6b7280">Budgets</text>
      <circle cx="260" cy="620" r="10" fill="none" stroke="#2f6fed" stroke-width="1.8"/>
      <path d="M260 614v7l4 3" stroke="#2f6fed" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="260" y="644" font-size="8.5" font-weight="600" fill="#2f6fed">History</text>
    </g>
    <rect x="118" y="652" width="84" height="4" rx="2" fill="#1f2430" opacity="0.28"/>
  </g>
</svg>
