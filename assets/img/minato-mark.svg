<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Minato Studio">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#15859a"/>
      <stop offset="1" stop-color="#0a2233"/>
    </linearGradient>
    <clipPath id="mc"><rect width="40" height="40" rx="11"/></clipPath>
  </defs>

  <g clip-path="url(#mc)">
    <rect width="40" height="40" fill="url(#mg)"/>

    <!-- the sun on the water: a journey either leaving or coming home -->
    <circle cx="20" cy="17.5" r="6.6" fill="#f0a03c"/>

    <!-- water -->
    <rect y="24" width="40" height="16" fill="#071a27" opacity="0.55"/>
    <g stroke="#7fd6e4" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M6 28.5q3-1.6 6 0t6 0 6 0 6 0"/>
      <path d="M9 33q3-1.6 6 0t6 0 6 0"/>
    </g>

    <!-- the harbour arms, reaching around the water -->
    <g stroke="#f7f3ec" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M4.5 11.5v8.5q0 4.5 4.5 4.5"/>
      <path d="M35.5 11.5v8.5q0 4.5-4.5 4.5"/>
    </g>
  </g>
</svg>
